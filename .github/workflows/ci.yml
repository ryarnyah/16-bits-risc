name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  formal-and-sim:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install sbt
        run: |
          echo "deb https://repo.scala-sbt.org/scalasbt/debian all main" | sudo tee /etc/apt/sources.list.d/sbt.list
          curl -sL "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x2EE0EA64E40A89B84B2DF73499E82A75642AC823" | sudo apt-key add -
          sudo apt-get update -qq
          sudo apt-get install -y -qq sbt

      - name: Cache sbt
        uses: actions/cache@v4
        with:
          path: |
            ~/.sbt
            ~/.cache/coursier
            ~/.ivy2/cache
          key: sbt-${{ hashFiles('build.sbt', 'project/build.properties', 'project/*.sbt') }}
          restore-keys: sbt-

      - name: Install EDA tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq verilator
          curl -sL https://github.com/YosysHQ/oss-cad-suite-build/releases/download/2025-04-25/oss-cad-suite-linux-x64-20250425.tgz \
            | sudo tar -xz -C /opt
          echo "/opt/oss-cad-suite/bin" >> "$GITHUB_PATH"

      - name: Run formal verification + unit tests
        run: sbt test

  c-programs:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install sbt
        run: |
          echo "deb https://repo.scala-sbt.org/scalasbt/debian all main" | sudo tee /etc/apt/sources.list.d/sbt.list
          curl -sL "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x2EE0EA64E40A89B84B2DF73499E82A75642AC823" | sudo apt-key add -
          sudo apt-get update -qq
          sudo apt-get install -y -qq sbt

      - name: Cache sbt
        uses: actions/cache@v4
        with:
          path: |
            ~/.sbt
            ~/.cache/coursier
            ~/.ivy2/cache
          key: sbt-${{ hashFiles('build.sbt', 'project/build.properties', 'project/*.sbt') }}
          restore-keys: sbt-

      - name: Install Verilator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq verilator

      - name: Run C tests on both cores
        run: make test-programs-all
